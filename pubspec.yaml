name: assisi_connect
description: Assisi Connect
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  rename_app: ^1.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/images/app_icon.png

  adaptive_icon_background: "#F5F1EA"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter_native_splash:
  color: "#F5F1EA"
  image: assets/images/splash_icon.png

  android: true
  ios: true

  android_12:
    color: "#F5F1EA"
    image: assets/images/splash_icon.png